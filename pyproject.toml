[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-upload-mcp"
version = "0.1.0"
description = "Security-hardened MCP server for YouTube video uploads, channel management, analytics, SEO, transcripts, and reporting"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "youtube-upload-mcp contributors" },
]
keywords = ["mcp", "youtube", "youtube-upload", "analytics", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.30.0,<2",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.0",
    "youtube-transcript-api>=1.0.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
youtube-upload-mcp = "youtube_upload_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_upload_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
